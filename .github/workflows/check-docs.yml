name: check-docs

on:
  workflow_call:
    inputs:
      python-version:
        description: Version de Python utilisee pour lancer le verificateur
        required: false
        type: string
        default: "3.12"

# Un workflow appele herite du scope du token appelant. Le verificateur ne fait
# que lire : on reduit explicitement, d autant qu un des repos consommateurs
# applique de l infrastructure.
permissions:
  contents: read

jobs:
  check-docs:
    runs-on: ubuntu-latest
    # Les quatre depots appelants sont prives, et les minutes d un workflow reutilisable sont
    # facturees a l appelant : ce job pese donc sur le quota de 2000 min/mois de l organisation,
    # epuise le 18/08/2026. Sans cette ligne, le defaut GitHub est 360 minutes — 18 % du quota
    # mensuel brule par un seul job bloque, dans quatre depots a la fois.
    timeout-minutes: 10
    steps:
      - name: Checkout du repo appelant
        uses: actions/checkout@v4

      - name: Checkout du standard de documentation
        uses: actions/checkout@v4
        with:
          repository: snetor/snetor-ai-guidelines
          ref: v1
          path: .docs-standard
          # Seul `scripts/` est lu. Cloner le depot entier tirait aussi les skills et leurs
          # references, pour rien.
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Installer les dependances
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Verifier la documentation
        run: python .docs-standard/scripts/check_docs.py --repo-root .
